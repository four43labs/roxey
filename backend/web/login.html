<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — roxey</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/common.css">
<style>
  .panel { max-width: 380px; margin: 18vh auto 0; }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 8px; }
</style>
</head>
<body>
<main class="panel panel-box">
  <h1 class="wordmark">roxey<span class="cursor">&#9608;</span></h1>
  <p class="sub">tunnel relay &mdash; dashboard access</p>

  <form id="form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn-solid">[ sign in ]</button>
    <p class="error-line" id="error"></p>
  </form>

  {{if not .SingleUser}}<p class="dim">no account? <a href="/signup">create one</a></p>{{end}}
</main>

<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('error');
  err.textContent = '';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    if (res.ok) {
      location.href = '/';
      return;
    }
    err.textContent = (await res.text()).replace(/^.*\n/, '') || 'sign in failed';
  } catch {
    err.textContent = 'network error';
  }
});
</script>
</body>
</html>
