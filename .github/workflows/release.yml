name: Release CLI

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Build
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          out="roxey_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "$out"
          go build -trimpath -ldflags="-s -w" -o "$out/roxey" .
          tar -czf "$out.tar.gz" -C "$out" roxey

      - uses: actions/upload-artifact@v4
        with:
          name: roxey_${{ matrix.goos }}_${{ matrix.goarch }}
          path: cli/roxey_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
