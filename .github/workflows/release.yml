name: Release CLI

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Build CLI
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          out="roxey_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "$out"
          go build -trimpath -ldflags="-s -w" -o "$out/roxey" .
          tar -czf "$out.tar.gz" -C "$out" roxey

      # The relay binary is published alongside the CLI so `roxey up` can
      # download it for local relay mode (same tag, matching platform).
      - name: Build relay
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          out="roxey-relay_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "$out"
          go build -trimpath -ldflags="-s -w" -o "$out/roxey-relay" .
          tar -czf "$out.tar.gz" -C "$out" roxey-relay

      - uses: actions/upload-artifact@v4
        with:
          name: bins_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            cli/roxey_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            backend/roxey-relay_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Artifacts keep their cli/ backend/ subdirectories when merged;
      # flatten so the release globs pick up every tarball.
      - name: Flatten artifact layout
        run: |
          mkdir -p dist
          find dist -type f -name '*.tar.gz' -exec mv -f {} dist/ \;

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # npm/bin/roxey.js fetches the matching binary from this same
      # release's assets by tag, so the npm package doesn't bundle
      # anything platform-specific — its version just needs to match.
      - name: Set package version from tag
        working-directory: npm
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Publish
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
